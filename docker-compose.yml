services:
  db:
    image: postgres:16
    container_name: talentmachine-db
    environment:
      POSTGRES_DB: talentmachine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - talentmachine-pgdata:/var/lib/postgresql/data

volumes:
  talentmachine-pgdata:
