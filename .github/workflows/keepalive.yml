name: Supabase keep-alive

# Supabase's free tier pauses a project after 7 days with no activity. This opens
# a connection and WRITES a heartbeat row twice a week, which resets that timer,
# so the database never idles out. Also runnable on demand from the Actions tab.
#
# GOTCHA (found 2026-09-17): the first version of this ran `select now();` — a
# pure function call that touches no table. The workflow ran successfully every
# time, but Supabase kept sending pause warnings anyway: its inactivity check
# looks at real table activity, not just "a connection happened". A read from a
# real table (Performers) was tried next and hasn't been proven to fail, but
# rather than trust another guess at undocumented criteria, this now does a
# genuine WRITE — the least ambiguous "this database is alive" signal there is.

on:
  schedule:
    # Mondays & Thursdays at 07:23 UTC. Twice a week is well inside the 7-day
    # window, so even a skipped/delayed run (GitHub can defer cron under load)
    # is harmless. Odd minute avoids the top-of-hour rush when runs get delayed.
    - cron: '23 7 * * 1,4'
  workflow_dispatch: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see .github/workflows/keepalive.yml"
            exit 1
          fi
          # psql ships preinstalled on ubuntu-latest. A single-row upsert into a
          # dedicated table: a real WRITE every run, no growth, idempotent, and
          # entirely separate from the app's own schema/migrations — this table
          # isn't an EF entity, it's pure ops plumbing the app never sees.
          psql "$SUPABASE_DB_URL" \
            -c 'CREATE TABLE IF NOT EXISTS "_KeepAlive" (id int PRIMARY KEY, pinged_at timestamptz NOT NULL);' \
            -tAc 'INSERT INTO "_KeepAlive" (id, pinged_at) VALUES (1, now())
                  ON CONFLICT (id) DO UPDATE SET pinged_at = excluded.pinged_at
                  RETURNING pinged_at;'
