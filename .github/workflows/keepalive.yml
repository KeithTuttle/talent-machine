name: Supabase keep-alive

# Supabase's free tier pauses a project after 7 days with no activity. This opens
# a connection and WRITES a heartbeat row once a day, which resets that timer, so
# the database never idles out. Also runnable on demand from the Actions tab.
#
# Daily (not the usual twice-weekly — see dance-manager's copy of this file) at
# the user's request after this project got a pause warning despite a working
# but insufficient keep-alive; more margin costs nothing (~2 min/month).
#
# GOTCHA (found 2026-09-17): the first version of this ran `select now();` — a
# pure function call that touches no table. The workflow ran successfully every
# time, but Supabase kept sending pause warnings anyway: its inactivity check
# looks at real table activity, not just "a connection happened". A read from a
# real table (Performers) was tried next and hasn't been proven to fail, but
# rather than trust another guess at undocumented criteria, this now does a
# genuine WRITE — the least ambiguous "this database is alive" signal there is.
#
# GOTCHA #2 (found 2026-11-10): GitHub DISABLES any scheduled workflow after 60
# days with no *repository* activity — and a workflow's own cron runs do NOT
# count as activity, only a commit/push does. So this file would run daily for
# months, keep Supabase perfectly alive, and still get itself switched off (we
# got the disable warning at ~54 days with zero commits since 2026-09-17). The
# fix: the `github-heartbeat` job below pushes a tiny timestamp commit about
# once a week, which resets GitHub's 60-day clock so this workflow keeps itself,
# and therefore Supabase, alive indefinitely. If you ever copy this to another
# repo (e.g. dance-manager), copy this job too or you'll hit the same trap.

on:
  schedule:
    # Every day at 07:23 UTC. Odd minute avoids the top-of-hour rush when runs
    # get delayed; even a missed day or two (GitHub can defer cron under load)
    # is still well inside the 7-day pause window.
    - cron: '23 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat row
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see .github/workflows/keepalive.yml"
            exit 1
          fi
          # psql ships preinstalled on ubuntu-latest. A single-row upsert into a
          # dedicated table: a real WRITE every run, no growth, idempotent, and
          # entirely separate from the app's own schema/migrations — this table
          # isn't an EF entity, it's pure ops plumbing the app never sees.
          psql "$SUPABASE_DB_URL" \
            -c 'CREATE TABLE IF NOT EXISTS "_KeepAlive" (id int PRIMARY KEY, pinged_at timestamptz NOT NULL);' \
            -tAc 'INSERT INTO "_KeepAlive" (id, pinged_at) VALUES (1, now())
                  ON CONFLICT (id) DO UPDATE SET pinged_at = excluded.pinged_at
                  RETURNING pinged_at;'

  # Keeps THIS workflow alive. See "GOTCHA #2" at the top: GitHub disables a
  # scheduled workflow after 60 days with no commit, and cron runs don't count.
  # A weekly timestamp commit is repository activity, so the 60-day clock never
  # runs out. Independent of the Supabase ping above — either can fail without
  # taking the other down.
  github-heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the default GITHUB_TOKEN push the heartbeat commit
    steps:
      - uses: actions/checkout@v4
      - name: Commit a weekly heartbeat to reset GitHub's 60-day timer
        run: |
          # Runs daily with the ping, but only commits on Mondays (UTC) to keep
          # history quiet. ~7-day gaps are comfortably inside the 60-day limit,
          # even if GitHub defers a cron run or two under load.
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (UTC) — nothing to commit today."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore(keepalive): weekly heartbeat to keep the workflow enabled [skip ci]"
          git push
